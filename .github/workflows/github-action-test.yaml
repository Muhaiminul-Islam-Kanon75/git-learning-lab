name: github-quiz-test 

on: 
  push: 
    branches:
      - main 
      - staging 
  
  pull_request: 

jobs:
  quiz-app: 
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 
    - name: setup python
      uses: actions/setup-python@v5
      with: 
        python-version: '3.12'
    
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run tests 
      run: pytest



