name: github-quiz-multiOS

on: 
  push: 
    branches:
    - main
    - staging
  pull_request:

jobs:
  quiz-multiOS:
    runs-on: ${{ matrix.os }} # matrix is must. os is independent var
    strategy: 
      matrix: 
        os:  [ubuntu-latest, ubuntu-22.04]
    
    steps:
    - name: check codes 
      uses: actions/checkout@v4
    - name: configure python v3.12
      uses: actions/setup-python@v5 
      with:
        python-version: '3.12'

    - name: install dependencies
      run: pip install -r requirements.txt
    - name: test 
      run: pytest

