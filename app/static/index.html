<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Learning Lab</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      body {
        margin: 0;
        padding: 2rem;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        min-height: 100vh;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }
      h1, h2 { margin-top: 0; }
      .card { margin-bottom: 1.5rem; }
      .question { margin-bottom: 1rem; }
      input, button { font-size: 1rem; padding: 0.7rem; border-radius: 8px; border: 1px solid #64748b; }
      input { width: 100%; box-sizing: border-box; margin-top: 0.4rem; }
      button { background: #38bdf8; color: #082f49; font-weight: bold; cursor: pointer; }
      button:hover { background: #7dd3fc; }
      #result, #simulator-result { margin-top: 1rem; padding: 1rem; background: #111827; border-radius: 8px; white-space: pre-wrap; }
      .pill { display: inline-block; background: #1d4ed8; color: white; padding: 0.35rem 0.6rem; border-radius: 999px; font-size: 0.8rem; margin-bottom: 0.8rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Git Learning Lab</h1>
      <p class="pill">Interactive Git Practice</p>
      <section class="card">
        <h2>Quiz</h2>
        <form id="quiz-form">
          <div id="questions"></div>
          <button type="submit">Submit Quiz</button>
        </form>
        <div id="result"></div>
      </section>

      <section class="card">
        <h2>Command Simulator</h2>
        <input id="command-input" placeholder="Try: init, clone, add, commit, push" />
        <button id="simulate-btn">Simulate</button>
        <div id="simulator-result"></div>
      </section>
    </main>

    <script>
      async function loadQuestions() {
        const response = await fetch('/api/questions');
        const data = await response.json();
        const container = document.getElementById('questions');
        container.innerHTML = '';

        data.questions.forEach((item, index) => {
          const div = document.createElement('div');
          div.className = 'question';
          div.innerHTML = `<label for="answer-${index}">${index + 1}. ${item.question}</label><input id="answer-${index}" name="answer-${index}" placeholder="Enter command" />`;
          container.appendChild(div);
        });
      }

      document.getElementById('quiz-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const answers = Array.from(document.querySelectorAll('#questions input')).map((input) => input.value.trim());
        const response = await fetch('/api/quiz', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answers })
        });
        const result = await response.json();
        const output = document.getElementById('result');
        output.textContent = `Score: ${result.score}/${result.total}\n\n` + result.results.map((item) => `${item.correct ? '✅' : '❌'} ${item.question}\nYour answer: ${item.user_answer || '(empty)'}\nExpected: ${item.expected}`).join('\n\n');
      });

      document.getElementById('simulate-btn').addEventListener('click', async () => {
        const command = document.getElementById('command-input').value.trim();
        const response = await fetch('/api/simulate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command })
        });
        const result = await response.json();
        document.getElementById('simulator-result').textContent = result.result;
      });

      loadQuestions();
    </script>
  </body>
</html>
